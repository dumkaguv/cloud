<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1480 990" role="img" aria-labelledby="title desc">
  <title id="title">Проектная архитектура TimeCapsule для лабораторной работы 3</title>
  <desc id="desc">Пользователи и администратор обращаются в VPC 10.16.0.0/16. В public-a находится app-server, в public-b bastion, в private-a db-server, private-b зарезервирована. NAT Gateway временный. Частная зона Route 53 содержит db.timecapsule.internal.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536177; }
      .scope { font-size: 18px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .public { fill: #eaf4ff; stroke: #60a5fa; stroke-width: 2; }
      .private { fill: #eafaf2; stroke: #34d399; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .zone { fill: #f7f9fd; stroke: #b5c0d4; stroke-width: 2; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .ssh { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow-purple); }
      .db { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-green); }
      .temp { fill: #fff9e7; stroke: #d97706; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1480" height="990" fill="#ffffff"/>
  <text x="34" y="46" class="title">TimeCapsule · лабораторная работа №3</text>
  <text x="34" y="72" class="subtitle">Проектная схема · k = 16 · eu-central-1 · ресурсы и адреса проверить после развёртывания</text>

  <!-- Actors outside AWS -->
  <rect x="32" y="180" width="200" height="83" rx="12" class="actor"/>
  <text x="50" y="211" class="label">Пользователи</text><text x="50" y="238" class="small">браузер · HTTP/80</text>
  <rect x="32" y="347" width="200" height="96" rx="12" class="actor"/>
  <text x="50" y="379" class="label">Администратор</text><text x="50" y="405" class="small">компьютер · SSH/22</text><text x="50" y="426" class="tiny">ключ только на компьютере</text>
  <rect x="32" y="540" width="200" height="89" rx="12" class="actor"/>
  <text x="50" y="574" class="label">GitHub</text><text x="50" y="600" class="small">публичный код приложения</text>
  <text x="32" y="667" class="small">Все три объекта — вне AWS</text>

  <!-- AWS, region, VPC -->
  <rect x="268" y="110" width="1175" height="824" rx="20" fill="#f8fafc" stroke="#6b7280" stroke-width="2"/>
  <text x="292" y="141" class="scope">AWS Cloud · регион eu-central-1 (Frankfurt)</text>
  <rect x="293" y="159" width="1125" height="748" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="315" y="188" class="scope">timecapsule-dev-vpc · 10.16.0.0/16</text>

  <!-- Internet gateway at VPC edge -->
  <rect x="315" y="233" width="150" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="328" y="262" class="label">Internet Gateway</text>
  <text x="328" y="286" class="tiny">timecapsule-dev-igw</text>
  <text x="328" y="306" class="tiny">0.0.0.0/0 · public-rt</text>

  <!-- Availability zones -->
  <rect x="490" y="207" width="405" height="515" rx="14" class="zone"/>
  <text x="510" y="234" class="label">eu-central-1a</text>
  <rect x="932" y="207" width="449" height="515" rx="14" class="zone"/>
  <text x="952" y="234" class="label">eu-central-1b</text>

  <!-- Public A -->
  <rect x="511" y="248" width="362" height="221" rx="12" class="public"/>
  <text x="528" y="275" class="label">timecapsule-dev-public-a</text>
  <text x="528" y="298" class="small">10.16.0.0/24 · timecapsule-dev-public-rt</text>
  <rect x="529" y="315" width="325" height="80" rx="9" class="node"/>
  <text x="544" y="337" class="label">timecapsule-dev-app</text>
  <text x="544" y="355" class="small">nginx → PHP-FPM</text>
  <text x="544" y="373" class="tiny">Elastic IP: timecapsule-dev-app-eip</text>
  <text x="544" y="389" class="tiny">timecapsule-dev-web-sg · HTTP/80, SSH от bastion-sg</text>
  <rect x="529" y="402" width="325" height="48" rx="9" class="temp"/>
  <text x="544" y="422" class="small">timecapsule-dev-nat-a · временно</text>
  <text x="544" y="439" class="tiny">timecapsule-dev-nat-a-eip</text>

  <!-- Public B -->
  <rect x="951" y="248" width="411" height="221" rx="12" class="public"/>
  <text x="968" y="275" class="label">timecapsule-dev-public-b</text>
  <text x="968" y="298" class="small">10.16.1.0/24 · timecapsule-dev-public-rt</text>
  <rect x="969" y="328" width="375" height="73" rx="9" class="node"/>
  <text x="984" y="352" class="label">timecapsule-dev-bastion</text>
  <text x="984" y="373" class="small">timecapsule-dev-bastion-sg</text>
  <text x="984" y="390" class="tiny">SSH/22 только с IP администратора</text>

  <!-- Private A -->
  <rect x="511" y="486" width="362" height="217" rx="12" class="private"/>
  <text x="528" y="513" class="label">timecapsule-dev-private-a</text>
  <text x="528" y="536" class="small">10.16.10.0/24 · timecapsule-dev-private-rt</text>
  <rect x="529" y="559" width="325" height="93" rx="9" class="node"/>
  <text x="544" y="584" class="label">timecapsule-dev-db</text>
  <text x="544" y="605" class="small">PostgreSQL · без публичного IP</text>
  <text x="544" y="624" class="tiny">timecapsule-dev-db-sg</text>
  <text x="544" y="641" class="tiny">5432 от web-sg · SSH от bastion-sg</text>

  <!-- Private B -->
  <rect x="951" y="486" width="411" height="217" rx="12" class="private"/>
  <text x="968" y="513" class="label">timecapsule-dev-private-b</text>
  <text x="968" y="536" class="small">10.16.11.0/24 · timecapsule-dev-private-rt</text>
  <text x="968" y="587" class="small">Резерв для будущей базы / реплики</text>
  <text x="968" y="611" class="tiny">Нет маршрута 0.0.0.0/0 в обычном состоянии</text>

  <!-- Private DNS -->
  <rect x="504" y="757" width="533" height="91" rx="12" fill="#f4efff" stroke="#9d7fe5" stroke-width="2"/>
  <text x="522" y="786" class="label">Route 53 · приватная зона timecapsule.internal</text>
  <text x="522" y="812" class="small">A: db.timecapsule.internal → приватный IP timecapsule-dev-db</text>
  <text x="522" y="833" class="tiny">Зона связана только с timecapsule-dev-vpc · TTL 60 с</text>
  <rect x="1065" y="757" width="322" height="91" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1081" y="786" class="label">Маршруты</text>
  <text x="1081" y="809" class="small">Обе RT: 10.16.0.0/16 → local</text>
  <text x="1081" y="830" class="small">private-rt: без выхода в интернет</text>

  <!-- Traffic arrows -->
  <path d="M232 220 H313" class="flow"/><text x="239" y="207" class="tiny">HTTP</text>
  <path d="M465 278 H482 V350 H529" class="flow"/>
  <path d="M232 390 H278 V201 H1155 V327" class="ssh"/><text x="764" y="196" class="tiny">SSH через bastion</text>
  <path d="M969 365 H917 V318 H855" class="ssh"/>
  <path d="M969 390 H906 V628 H855" class="ssh"/><text x="908" y="619" class="tiny">SSH к БД</text>
  <path d="M692 386 V558" class="db"/><text x="703" y="482" class="tiny">PostgreSQL/5432</text>
  <path d="M838 386 H883 V738 H770 V756" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M529 364 H477 V582 H233" class="flow"/><text x="245" y="567" class="tiny">git pull HTTPS</text>
  <text x="529" y="677" class="tiny">NAT и маршрут 0.0.0.0/0 — только во время обновлений</text>

  <text x="31" y="960" class="small">Синий — HTTP / получение кода · фиолетовый — SSH / DNS · зелёный — приложение → БД · пунктир — временный ресурс</text>
</svg>
